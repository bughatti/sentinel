# Mosquitto MQTT Broker — Sentinel NVR
# =====================================
# Basic configuration: unauthenticated, listens on 1883 (MQTT) and
# 9001 (WebSocket). For production, enable authentication and TLS.

# ── Listener: MQTT ──────────────────────────────────────────────
listener 1883 0.0.0.0
protocol mqtt

# ── Listener: WebSocket ─────────────────────────────────────────
listener 9001 0.0.0.0
protocol websockets

# ── Security ────────────────────────────────────────────────────
# Allow all connections without authentication.
# For production, set allow_anonymous false and configure a password file.
allow_anonymous true

# Uncomment to require authentication:
# allow_anonymous false
# password_file /mosquitto/config/password.txt

# ── Persistence ─────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ─────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Suppress noisy connect/disconnect messages at info level.
# log_type subscribe
# log_type unsubscribe

# ── Message Limits ──────────────────────────────────────────────
# Maximum number of queued messages per client.
max_queued_messages 1000

# Maximum message size (bytes). 0 = unlimited.
# Sentinel snapshots are not sent over MQTT, so 64 KB is sufficient.
message_size_limit 65536
