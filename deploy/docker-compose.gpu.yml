---
# Sentinel NVR — GPU (NVIDIA) override
# =====================================
# Use with: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml up -d
#
# Requires:
#   - NVIDIA GPU
#   - NVIDIA Container Toolkit (nvidia-docker2)
#   - nvidia-smi accessible from the Docker host

version: "3.9"

services:

  sentinel:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility

  # ── NVIDIA DeepStream Bridge ────────────────────────────────────
  # The DeepStream bridge exposes a gRPC endpoint that Sentinel's
  # deepstream detector backend connects to for GPU-accelerated
  # multi-stream inference.
  #
  # Build your own DeepStream bridge image; no prebuilt image is published yet.
  deepstream:
    image: deepstream-bridge:latest
    container_name: sentinel-deepstream
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      - sentinel
    ports:
      - "50051:50051"    # gRPC
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - DS_MODEL_PATH=/models/yolov9s_ds.engine
      - DS_BATCH_SIZE=4
      - DS_INPUT_WIDTH=320
      - DS_INPUT_HEIGHT=320
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
