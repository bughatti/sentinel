---
# Sentinel NVR — GPU (NVIDIA) override
# =====================================
# Use from the deploy/ directory:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Requires:
#   - NVIDIA GPU
#   - NVIDIA Container Toolkit (nvidia-docker2)
#   - nvidia-smi accessible from the Docker host


services:

  sentinel:
    # The NVIDIA image: CUDA, cuDNN, TensorRT and the GPU build of ONNX Runtime.
    # Several gigabytes, which is why the CPU image is the default.
    image: ghcr.io/bughatti/sentinel:latest
    # build:
    #   context: ..
    #   dockerfile: deploy/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility

  # ── NVIDIA DeepStream Bridge ────────────────────────────────────
  # The DeepStream bridge exposes a gRPC endpoint that Sentinel's
  # deepstream detector backend connects to for GPU-accelerated
  # multi-stream inference.
  #
  # Build your own DeepStream bridge image; no prebuilt image is published yet.
  # It is behind a profile so the GPU override works without it. Enable with:
  #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile deepstream up -d
  deepstream:
    profiles: ["deepstream"]
    image: deepstream-bridge:latest
    container_name: sentinel-deepstream
    restart: unless-stopped
    runtime: nvidia
    depends_on:
      - sentinel
    ports:
      - "50051:50051"    # gRPC
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - DS_MODEL_PATH=/models/yolov9s_ds.engine
      - DS_BATCH_SIZE=4
      - DS_INPUT_WIDTH=320
      - DS_INPUT_HEIGHT=320
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
