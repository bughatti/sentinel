name: CI

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["master", "main"]

env:
  GO_VERSION: "1.23"

jobs:
  # ── Lint & Test ─────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install ONNX Runtime (for CGO build)
        run: |
          ORT_VERSION=1.18.1
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            -o /tmp/ort.tgz
          sudo tar xzf /tmp/ort.tgz -C /usr/local --strip-components=1
          sudo ldconfig
          echo "CGO_CFLAGS=-I/usr/local/include/onnxruntime" >> $GITHUB_ENV
          echo "CGO_LDFLAGS=-L/usr/local/lib -lonnxruntime" >> $GITHUB_ENV

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Download Go modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned: "latest" lets new rules break a build nobody touched.
          version: v1.64.8
          args: --timeout=5m

      - name: Test
        env:
          SENTINEL_DB_URL: "postgresql://sentinel:sentinel@localhost:5432/sentinel_test?sslmode=disable"
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out

  # ── Build (linux/amd64) ──────────────────────────────────────────
  build-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install ONNX Runtime
        run: |
          ORT_VERSION=1.18.1
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" \
            -o /tmp/ort.tgz
          sudo tar xzf /tmp/ort.tgz -C /usr/local --strip-components=1
          sudo ldconfig

      - name: Build
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-I/usr/local/include/onnxruntime"
          CGO_LDFLAGS: "-L/usr/local/lib -lonnxruntime"
          GOARCH: amd64
          GOOS: linux
        run: |
          go build \
            -ldflags="-s -w -X github.com/bughatti/sentinel/internal/app.Version=$(git describe --tags --always --dirty)" \
            -o sentinel-linux-amd64 \
            ./cmd/sentinel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-amd64
          path: sentinel-linux-amd64

  # ── Build (linux/arm64) ──────────────────────────────────────────
  build-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build (CGO cross-compile for arm64)
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          CGO_ENABLED=1 \
          CC=aarch64-linux-gnu-gcc \
          GOARCH=arm64 \
          GOOS=linux \
          go build \
            -ldflags="-s -w -X github.com/bughatti/sentinel/internal/app.Version=$(git describe --tags --always --dirty)" \
            -o sentinel-linux-arm64 \
            ./cmd/sentinel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-linux-arm64
          path: sentinel-linux-arm64

  # ── Docker build check ───────────────────────────────────────────
  docker-image:
    name: Container image
    runs-on: ubuntu-latest
    needs: test
    # Only on tags. This image is ~7 GB, so building it on every push costs
    # ten minutes of CI for an artefact nobody consumes between releases.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A 7 GB CUDA image does not fit beside the runner's preinstalled
      # toolchains. Reclaim ~20 GB before building, or the runner is killed
      # mid-build and never even uploads its logs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min: a full export of this image blows past the 10 GB
          # Actions cache limit and costs more time than it saves.
          cache-to: type=gha,mode=min
